{{- if .Values.secrets.create }}
{{- $s := .Values.secrets.values }}
# Created only when secrets.create is true (development). In prod, create this Secret yourself.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.name }}
  labels:
    {{- include "sava.labels" . | nindent 4 }}
type: Opaque
stringData:
  jwt-key: {{ required "secrets.values.jwtKey is required" $s.jwtKey | quote }}
  rabbitmq-user: {{ required "secrets.values.rabbitmqUser is required" $s.rabbitmqUser | quote }}
  rabbitmq-password: {{ required "secrets.values.rabbitmqPassword is required" $s.rabbitmqPassword | quote }}
  {{- if .Values.mysql.enabled }}
  mysql-root-password: {{ required "secrets.values.mysqlRootPassword is required" $s.mysqlRootPassword | quote }}
  {{- end }}
  customer-db: {{ include "sava.connectionString" (dict "root" . "value" $s.customerDb "database" "savadb_cust") | quote }}
  inventory-db: {{ include "sava.connectionString" (dict "root" . "value" $s.inventoryDb "database" "savadb_inv") | quote }}
  order-db: {{ include "sava.connectionString" (dict "root" . "value" $s.orderDb "database" "savadb_order") | quote }}
{{- end }}
