name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore tools
        run: dotnet tool restore

      - name: Check formatting
        run: dotnet csharpier check backend

      - name: Build
        run: dotnet build backend/Sava.slnx

      # Integration tests start a MySQL container via Testcontainers (Docker is available on ubuntu-latest).
      - name: Test
        run: dotnet test --solution backend/Sava.slnx --no-build --coverlet --results-directory "${{ github.workspace }}/TestResults"

      - name: Coverage report
        if: ${{ !cancelled() }}
        run: >-
          dotnet reportgenerator
          -reports:"TestResults/*.cobertura*.xml"
          -targetdir:TestResults/coverage-report
          -reporttypes:"Html;MarkdownSummaryGithub"
          && cat TestResults/coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: coverage-report
          path: TestResults/coverage-report
