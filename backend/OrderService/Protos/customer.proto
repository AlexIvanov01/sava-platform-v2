syntax = "proto3";

option csharp_namespace = "CustomerService";

service GrpcCustomer{
	rpc GetAllCustomers (GetAllRequest) returns (CustomerResponse);
	// Fails with NOT_FOUND when the customer doesn't exist.
	rpc GetCustomer (GetCustomerRequest) returns (GrpcCustomerModel);
}

message GetAllRequest {}

message GetCustomerRequest {
    string id = 1;
}

message GrpcCustomerModel{
    string ExternalId = 1;
    string Name = 2;
    string CompanyName = 3;
    string Email = 4;
    string PhoneNumber = 5;
    string Address = 6;
    string City = 7;
    string Country = 8;
    string BankName = 9;
    string IBAN = 10;
    string BIC = 11;
    string VATNumber = 12;
    string UIC = 13;
}

message CustomerResponse {
	repeated GrpcCustomerModel customers = 1;
}