# Hosted cluster. Before installing:
#   1. Push images tagged with the release (git SHA) and pass --set image.tag=<sha>.
#   2. Create the `sava-secrets` Secret (see README) with the MySQL root password and the
#      connection strings for the in-cluster MySQL.
#   3. Install an ingress controller and cert-manager with a ClusterIssuer.
environment: Production

image:
  tag: "" # set with --set image.tag=<git sha>
  pullPolicy: IfNotPresent

secrets:
  create: false
  name: sava-secrets

mysql:
  enabled: true
  innodbBufferPoolSize: 512M
  # Uses the cluster's default StorageClass unless storageClassName is set.
  storage: 10Gi
  resources:
    requests: { cpu: 250m, memory: 1Gi }
    limits: { memory: 1536Mi }

gateway:
  service:
    type: ClusterIP

ingress:
  enabled: true
  className: nginx
  host: sava.example.com # replace with your domain
  tls:
    enabled: true
    secretName: sava-tls
    clusterIssuer: letsencrypt-prod
